name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      skip_cache:
        description: 'Skip build cache'
        required: false
        type: boolean

env:
  CUSTOM_DOMAIN: 'xarcher.dev'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Check manual trigger
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        echo "🚀 Manual deployment triggered by: ${{ github.actor }}"
        echo "📋 Environment: ${{ github.event.inputs.environment }}"
        echo "🔁 Skip cache: ${{ github.event.inputs.skip_cache }}"
        echo "🌐 Target domain: ${{ env.CUSTOM_DOMAIN }}"

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate required files
      run: |
        echo "📁 Checking required files..."
        if [ ! -f "index.html" ]; then
          echo "❌ ERROR: index.html not found!"
          exit 1
        fi
        
        if [ -f "CNAME" ]; then
          echo "✅ CNAME found: $(cat CNAME)"
        else
          echo "⚠️  CNAME not found (optional for custom domain)"
        fi
        
        echo "✅ All required files validated"

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v4

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Deployment Success
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "🌐 Live URL: https://${{ env.CUSTOM_DOMAIN }}"
        echo "📊 GitHub Pages URL: ${{ steps.deployment.outputs.page_url }}"
        echo "👤 Deployed by: ${{ github.actor }}"
        echo "🕒 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
